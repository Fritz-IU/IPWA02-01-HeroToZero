<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="WEB-INF/template/template.xhtml">
    <ui:define name="content">
    <h1>CO2-Emissionen aktualisieren</h1>
    <h:form>
        <p:dataTable var="land" value="#{Laender.laenderListe}">
            <p:column headerText="Land">
                <p:inputText value="#{land.name}" required="true" disabled="true"/>
            </p:column>
            <p:column headerText="Ländercode">
                <p:inputText value="#{land.laendercode}" maxlength="2" required="true" disabled="true" oninput="this.value = this.value.replace(/\s|[^A-Z]/gi, '').toUpperCase()" validatorMessage="Der Ländercode muss zwei Buchstaben lang sein!">
                    <f:validateLength minimum="2"/>
                </p:inputText>
            </p:column>
            <p:column headerText="Jährliche CO2-Emision">
                <p:inputNumber value="#{land.co2Emission}" symbol=" t" symbolPosition="s" decimalPlaces="2" required="true">
                </p:inputNumber>
            </p:column>
            <p:column headerText="Meldedatum">
                <p:datePicker value="#{land.gemeldetAm}" patter="dd.MM.yyyy" required="true">
                </p:datePicker>
            </p:column>
            <p:column headerText="Änderungen Speichern">
                <p:commandButton value="Anderung speichern" icon="pi pi-save" action="#{Laender.updateSingleLand(land)}" update="@this :messages" process="@this @parent:@parent"/>
            </p:column>
        </p:dataTable>
    </h:form>

    </ui:define>
</ui:composition>
