<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="WEB-INF/template/template.xhtml">
    <ui:define name="content">
    <h1>Land hinzufügen</h1>
    <h:form id="landHinzufuegen">
        <p:dataTable var="land" value="#{Laender.neuesLand}">
            <p:column headerText="Land">
                <p:inputText id="name" value="#{land.name}" title="Bitte gebe den Namen des Landes an." required="true"/>
            </p:column>
            <p:column headerText="Ländercode">
                <p:inputText id="laendercode" value="#{land.laendercode}" maxlength="2" required="true" oninput="this.value = this.value.replace(/\s|[^A-Z]/gi, '').toUpperCase()" title="Bitte gebe den zweistelligen Ländercode nach ISO 3166-1 an." requiredMessage="Bitte gibt einen Ländercode an!" validatorMessage="Der Ländercode muss zwei Buchstaben lang sein!">
                    <f:validateLength minimum="2"/>
                </p:inputText>
            </p:column>
            <p:column headerText="Jahr">
                <p:inputNumber id="jahr" value="#{land.jahr}" decimalPlaces="0" minValue="1900" maxValue="2100" thousandSeparator="" required="true" title="Bitte gebe das Jahr an, in dem die CO2-Emissionen ausgestoßen wurden."/>
            </p:column>
            <p:column headerText="Jährliche CO2-Emision">
                <p:inputNumber id="co2Emision" value="#{land.co2Emission}" symbol=" t" symbolPosition="s" decimalPlaces="2" required="true" title="Bitte gebe die CO2-Emmisionen für ein Jahr an."/>
            </p:column>
        </p:dataTable>
        <p:tooltip globalSelector="input, .ui-inputfield, .ui-datepicker-input" showEvent="focus click" hideEvent="blur" position="top"/>
    </h:form>
    </ui:define>
</ui:composition>
