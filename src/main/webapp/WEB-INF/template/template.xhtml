<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Like Hero To Zero</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<h:body>
    <h:form id="navbar">
        <div class="container-fluid border-bottum bg-white shadow-sm">
            <div class="row align-items-center">
                <div class="col">
                    <p:menubar styleClass="bg-transparent">
                        <p:menuitem value="Länderliste" icon="pi pi-globe" outcome="showCO2"/>
                        <p:menuitem value="Länder bearbeiten" icon="pi pi-pencil" outcome="editCO2"
                                    rendered="#{Login.wissen}"/>
                        <p:menuitem value="Land hinzufügen" icon="pi pi-plus" outcome="addLand"
                                    rendered="#{Login.wissen}"/>
                        <p:menuitem value="Updates prüfen" icon="pi pi-shield" outcome="checkUpdate"
                                    rendered="#{Login.admin}"/>
                    </p:menubar>
                </div>
                <div class="col-auto d-flex align-items-center">
                    <h:panelGroup rendered="#{Login.angemeldet}">
                        <div class="me-3 text-end">
                            <small class="text-muted d-block">Angemeldet als</small>
                            <span class="fw-bold">#{Login.benutzerAngemeldet.name}</span>
                            <span class="badge bg-primary ms-1">#{Login.benutzerAngemeldet.rolle}</span>
                        </div>
                        <p:commandButton value="Abmelden" icon="pi pi-sign-out" action="#{Login.logout()}"
                                         styleClass="ui-button-flat ui-button-danger"/>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{!Login.angemeldet}">
                        <p:button value="Anmelden" icon="pi pi-sign-in" outcome="login" styleClass="ui-button-primary"/>
                        <p:button value="Registrieren" icon="pi pi-user-plus" outcome="registrieren"
                                  styleClass="ui-button-flat"/>
                    </h:panelGroup>
                </div>
            </div>
        </div>
    </h:form>

    <div class="container">
        <p:growl id="messages" showDetail="true">
            <p:autoUpdate/>
        </p:growl>

        <ui:insert name="content"/>
    </div>

</h:body>
</html>
