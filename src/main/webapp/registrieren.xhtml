<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Like Hero To Zero</title>
</h:head>
<h:body>
    <h1>Anmeldung bei Hero To Zero</h1>
    <h:form id="loginForm">
        <p:card style="width: 25em">
            <f:facet name="title"><i class="pi pi-user-plus" /> Registrieren</f:facet>
            <p:panelGrid columns="1" layout="grid">
                <p:row>
                    <p:outputLabel value="Benutzername: " for="name" />
                    <p:inputText id="name" value="#{Login.neuerBenutzer.name}" style="width: 100%" required="true" requiredMessage="Bitte Benutzernamen eingeben." />
                </p:row>

                <p:row>
                    <p:outputLabel value="Passwort: " for="passwort" />
                    <p:password id="passwort" value="#{Login.neuerBenutzer.passwort}" style="width: 100%" required="true" requiredMessage="Bitte Passwort eingaben." />
                </p:row>
            </p:panelGrid>
            <f:facet name="footer">
                <p:commandButton value="Registrieren" action="#{Login.registrieren()}" icon="pi pi-pencil" style="width: 100%" />
                <p:messages closable="true">
                    <p:autoUpdate />
                </p:messages>
            </f:facet>
        </p:card>
    </h:form>

</h:body>
</html>
