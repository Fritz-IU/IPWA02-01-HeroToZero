<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="WEB-INF/template/template.xhtml">
    <ui:define name="content">
        <div class="d-flex justify-content-center">
            <h:form id="loginForm">
                <p:card style="width: 25em">
                    <f:facet name="title"><i class="pi pi-user-plus" /> Registrieren</f:facet>
                    <p:panelGrid columns="1" layout="grid">
                        <p:row>
                            <p:outputLabel value="Benutzername: " for="name" />
                            <p:inputText id="name" value="#{Login.neuerBenutzer.name}" style="width: 100%" required="true" requiredMessage="Bitte Benutzernamen eingeben." />
                        </p:row>
                        <p:row>
                            <p:outputLabel value="Passwort: " for="passwort" />
                            <p:password id="passwort" value="#{Login.neuerBenutzer.passwort}" style="width: 100%" required="true" requiredMessage="Bitte Passwort eingeben." />
                        </p:row>
                        <p:row>
                            <p:outputLabel value="Rolle: " for="rolle" />
                            <p:selectOneMenu id="rolle" value="#{Login.neuerBenutzer.rolle}" style="width: 100%" required="true" requiredMessage="Bitte Rolle auswählen.">
                                <f:selectItems value="#{Login.rolle}" var="r" itemLabel="#{r}" itemValue="#{r}" />
                            </p:selectOneMenu>
                        </p:row>
                    </p:panelGrid>
                    <f:facet name="footer">
                        <p:commandButton value="Registrieren" action="#{Login.registrieren()}" icon="pi pi-pencil" style="width: 100%" />
                    </f:facet>
                </p:card>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
