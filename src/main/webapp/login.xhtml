<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Like Hero To Zero</title>
</h:head>
<h:body>
    <h1>Anmeldung bei Hero To Zero</h1>
    <h:form>
        <p:card style="width: 30em">
            <f:facet name="title">Login</f:facet>
            <p:panelGrid>
                <p:row>
                    <p:outputLabel value="Benutzername: " for="name" />
                    <p:inputText id="name" value="#{Login.name}" size="25">

                    </p:inputText>
                </p:row>
            </p:panelGrid>
        </p:card>
    </h:form>

</h:body>
</html>
