<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="WEB-INF/template/template.xhtml">
    <ui:define name="content">
        <h1>Aktualisierungen und neue Länder prüfen</h1>
        <h:form>
            <p:dataTable id="updateTable" var="landUpdate" value="#{Update.laenderUpdate}" tableStyle="width: auto">
                <p:column headerText="Land">
                    <h:outputText value="#{landUpdate.name}"/>
                </p:column>
                <p:column headerText="Ländercode">
                    <h:outputText value="#{landUpdate.laendercode}"/>
                </p:column>
                <p:column headerText="Jahr">
                    <p:outputLabel value="#{landUpdate.jahr}" decimalPlaces="0" thousandSeparator="" disabled="true"/>
                </p:column>
                <p:column headerText="Jährliche CO2-Emision">
                    <h:outputText value="#{landUpdate.co2Emission}">
                        <f:convertNumber type="number" pattern="#,##0.00' t'" locale="de_DE"/>
                    </h:outputText>
                </p:column>
                <p:column headerText="Typ">
                    <span class="badge p-3 w-100 rounded-pill fs-6"
                          style="font-family: inherit; font-weight: 600; font-size: 0.95rem; background-color: #{!landUpdate.vorhandenLand ? '#e8f5e9' : '#e0f7fa'}; color: #{!landUpdate.vorhandenLand ? '#1b5e20' : '#006064'} ">
                             #{!landUpdate.vorhandenLand ? 'Neuer Eintrag' : 'Eintrag aktualisiert'}
                    </span>
                </p:column>
                <p:column headerText="Status der Überprüfung">
                    <h:outputText value="#{landUpdate.updateStatus}"/>
                </p:column>
                <p:column headerText="Aktion">
                    <div class="d-flex gap-2 justify-conttent-center">
                        <p:commandButton value="Akzeptieren" icon="pi pi-thumbs-up"
                                         action="#{Update.accept(landUpdate)}" update="updateTable msgs"
                                         styleClass="ui-button-success ui-button-outlined"/>
                        <p:commandButton value="Ablehnen" icon="pi pi-thumbs-down"
                                         action="#{Update.reject(landUpdate)}" update="updateTable msgs"
                                         styleClass="ui-button-danger ui-button-outlined"/>
                    </div>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
