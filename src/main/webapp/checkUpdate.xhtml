<?xml version='1.0' encoding='UTF-8' ?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head><title>Like Hero To Zero</title></h:head>
<h:body>
    <h1>Aktualisierungen und neue Länder prüfen</h1>
    <h:form>
        <p:dataTable var="landUpdate" value="#{Update.laenderUpdate}">
            <p:column headerText="Land">
                <h:outputText value="#{landUpdate.name}"/>
            </p:column>
            <p:column headerText="Ländercode">
                <h:outputText value="#{landUpdate.laendercode}"/>
            </p:column>
            <p:column headerText="Jährliche CO2-Emision">
                <h:outputText value="#{landUpdate.co2Emission}">
                    <f:convertNumber type="number" pattern="#,##0.00' t'" locale="de_DE" />
                </h:outputText>
            </p:column>
            <p:column headerText="Meldedatum">
                <p:datePicker value="#{landUpdate.gemeldetAm}" patter="dd.MM.yyyy" disabled="true">
                </p:datePicker>
            </p:column>
            <p:column headerText="Neues Land oder aktualisierung?">
                <p:selectBooleanButton value="#{!landUpdate.vorhandenLand}" onLabel="Neues Land" offLabel="Land aktualisiert" style="width: 200px" disabled="true"/>
            </p:column>
            <p:column headerText="Status der Überprüfung">
                <h:outputText value="#{landUpdate.updateStatus}"/>
            </p:column>
            <p:column headerText="Aktion">
                <p:panelGrid columns="2">
                    <p:commandButton value="Akzeptieren" icon="pi pi-thumbs-up" action="#{controller.acceptUpdate(landUpdate)}" update="@this :messages" process="@this @parent:@parent" />
                    <p:commandButton value="Ablehnen" icon="pi pi-thumbs-down"  />
                </p:panelGrid>
            </p:column>
        </p:dataTable>
        <p:commandButton value="Liste anzeigen" icon="pi pi-pencil" action="#{controller.showCO2()}"/>
        <p:commandButton value="Liste bearbeiten" icon="pi pi-pencil" action="#{controller.startEdit()}"/>
    </h:form>



</h:body>
</html>
